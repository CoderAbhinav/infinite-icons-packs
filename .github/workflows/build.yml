name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build all packs (kses + visual + schema + name validation)
        run: npm run build
      - name: Check the README pack table is up to date
        run: node scripts/pack-table.mjs --check
      - name: Extract pack previews
        run: node scripts/previews.mjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: dist/report/
          if-no-files-found: ignore
      - name: Upload packs
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: |
            dist/*.zip
            dist/index.json
